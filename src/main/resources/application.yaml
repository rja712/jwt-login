spring:
  application:
    name: jwt-login
  datasource:
    url: jdbc:postgresql://localhost:5433/stock_int
    username: stock_int_user
    password: stock_int_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db.migration
    baseline-on-migrate: true

jwt:
  secret: this-is-a-32-char-secret-for-jwt
