spring:
  application:
    name: jwt-login
  datasource:
    url: jdbc:postgresql://localhost:5433/mini_idm
    username: idm_user
    password: idm_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    mongodb:
      uri: mongodb://localhost:27017/mini_idm
  flyway:
    enabled: true
    locations: classpath:db.migration
    baseline-on-migrate: true
